{"name":"Daily original scripts","on":{"schedule":[{"cron":"0 15 * * *"}],"workflow_dispatch":{"inputs":{"execute":{"description":"Run originals and perform account operations","type":"boolean","default":false}}}},"permissions":{"contents":"read"},"concurrency":{"group":"original-daily","cancel-in-progress":false},"jobs":{"run":{"if":"github.event_name == 'workflow_dispatch' || vars.RUN_ENABLED == 'true'","runs-on":"ubuntu-24.04","timeout-minutes":25,"strategy":{"fail-fast":false,"max-parallel":1,"matrix":{"script":["good2","good3"]}},"steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"uses":"browser-actions/setup-edge@v1"},{"name":"Prepare runtime","run":"sudo apt-get update -qq && sudo apt-get install -y xvfb && python -m pip install 'selenium>=4,<5' 'beautifulsoup4>=4,<5'"},{"name":"Execute unchanged original","env":{"ORIGINAL_B64":"${{ matrix.script == 'good2' && secrets.GOOD2_ORIGINAL_B64 || secrets.GOOD3_ORIGINAL_B64 }}","SCRIPT_NAME":"${{ matrix.script }}","EXECUTE":"${{ github.event_name == 'schedule' || inputs.execute }}"},"run":"xvfb-run -a python runner.py"}]}}}
